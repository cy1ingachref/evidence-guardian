name: EvidenceGuardian CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check evidence_guardian/ || true

      - name: Type check with mypy
        run: |
          mypy evidence_guardian/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run demo scan
        run: |
          python -m evidence_guardian.cli info

  security-audit:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run self-scan on demo target
        run: |
          # Start demo server in background
          cd evidence_guardian/demo && python vulnerable_app.py &
          sleep 3
          # Run scan
          python -m evidence_guardian.cli scan http://127.0.0.1:5000 --scope "CI self-scan" --mock --no-open
          # Check for findings
          ls -la reports/

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report-${{ github.run_number }}
          path: reports/*.html
          retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-audit]
    if: always()

    steps:
      - name: Notify on failure
        if: ${{ needs.test.result == 'failure' || needs.security-audit.result == 'failure' }}
        run: |
          echo "CI failed! Check logs for details."
          # Add webhook notification here
          # curl -X POST $WEBHOOK_URL -d '{"text":"CI failed for EvidenceGuardian"}'
